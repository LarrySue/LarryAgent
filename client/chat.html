<!DOCTYPE html>
<!--
  ============================================
  LarryAgent 测试用对话页面
  用途：开发调试阶段快速验证后端 /api/chat 接口
  方式：启动后端后访问 http://127.0.0.1:8000/chat.html（同源托管）
  依赖：后端 uvicorn 必须在 127.0.0.1:8000 运行
  注意：本页面仅为临时测试工具，非正式客户端
  ============================================
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LarryAgent - Test Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Microsoft YaHei", sans-serif;
    background: #1a1a2e;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .header {
    padding: 12px 20px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
    font-size: 16px;
    font-weight: 600;
  }
  .header .dot { color: #00ff88; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #0f3460;
  }
  .msg.agent {
    align-self: flex-start;
    background: #16213e;
    border: 1px solid #0f3460;
  }
  .msg.error {
    align-self: flex-start;
    background: #3a1a1a;
    border: 1px solid #8b0000;
    color: #ff6b6b;
  }
  .tool-card {
    align-self: flex-start;
    max-width: 85%;
    padding: 8px 12px;
    margin: 4px 0;
    background: #1e2a3a;
    border: 1px solid #2a4060;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
  .tool-card .tool-header {
    display: flex;
    align-items: center;
    gap: 6px;
    font-weight: 600;
    color: #5fa9d4;
  }
  .tool-card .tool-header .icon { font-size: 14px; }
  .tool-card .tool-result {
    margin-top: 4px;
    padding-top: 4px;
    border-top: 1px solid #2a4060;
    color: #aaa;
    font-size: 12px;
    max-height: 100px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .tool-card .tool-result.error { color: #ff6b6b; }
  .spinner {
    display: inline-block;
    width: 12px;
    height: 12px;
    border: 2px solid #5fa9d4;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .input-area {
    display: flex;
    padding: 12px 20px;
    background: #16213e;
    border-top: 1px solid #0f3460;
    gap: 10px;
  }
  #input {
    flex: 1;
    padding: 10px 14px;
    background: #1a1a2e;
    border: 1px solid #0f3460;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 14px;
    resize: none;
    outline: none;
  }
  #input:focus { border-color: #00ff88; }
  #send {
    padding: 10px 20px;
    background: #00ff88;
    color: #1a1a2e;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }
  .status {
    padding: 6px 20px;
    font-size: 12px;
    color: #888;
    text-align: right;
  }
  .model-select {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #888;
    padding: 0 20px 4px;
  }
  .model-select select {
    background: #1a1a2e;
    color: #e0e0e0;
    border: 1px solid #0f3460;
    border-radius: 4px;
    padding: 2px 6px;
    font-size: 12px;
  }
</style>
</head>
<body>
  <div class="header">LarryAgent <span class="dot">●</span></div>
  <div class="model-select">
    模型：
    <select id="modelSelect">
      <option value="deepseek-chat">DeepSeek V4 Flash</option>
      <option value="qwen-plus">Qwen Plus</option>
      <option value="gpt-4o">GPT-4o</option>
    </select>
  </div>
  <div id="messages"></div>
  <div class="status" id="status"></div>
  <div class="input-area">
    <textarea id="input" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行" onkeydown="handleKey(event)"></textarea>
    <button id="send" onclick="send()">发送</button>
  </div>

<script>
// 同源托管：页面由后端 /chat.html 路由提供，API 用相对路径即可
const API = '';

async function send() {
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const msg = input.value.trim();
  if (!msg) return;

  addMessage(msg, 'user');
  input.value = '';
  sendBtn.disabled = true;
  setStatus('思考中...');

  const model = document.getElementById('modelSelect').value;

  try {
    const res = await fetch(API + '/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'text/event-stream',
      },
      body: JSON.stringify({ message: msg, model: model })
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      addMessage(`Error: ${err.detail || JSON.stringify(err)}`, 'error');
      setStatus('');
      sendBtn.disabled = false;
      return;
    }

    // 检查是否是 SSE 流
    const ct = res.headers.get('content-type') || '';
    if (ct.includes('text/event-stream')) {
      await consumeSSEStream(res);
    } else {
      // 非流式 JSON 响应
      const data = await res.json();
      addMessage(data.reply, 'agent');
      setStatus(`conversation #${data.conversation_id} | model: ${data.model || model}`);
    }
  } catch (e) {
    addMessage(`网络错误: ${e.message}`, 'error');
    setStatus('离线');
  }
  sendBtn.disabled = false;
}

async function consumeSSEStream(res) {
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let agentMsg = null;
  let agentText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });

    // 解析 SSE 事件（以 \n\n 分隔）
    const events = buffer.split('\n\n');
    buffer = events.pop(); // 最后一段可能不完整

    for (const raw of events) {
      if (!raw.trim()) continue;
      const event = parseSSE(raw);
      if (!event) continue;

      switch (event.type) {
        case 'tool_call':
          if (agentMsg) {
            // 如果已有 agent 消息，先完成它
            agentMsg = null;
            agentText = '';
          }
          addToolCard(event.name, event.round, event.arguments);
          setStatus(`执行工具: ${event.name} (轮次 ${event.round})`);
          break;

        case 'tool_result':
          updateToolCard(event.name, event.round, event.success, event.content);
          setStatus('思考中...');
          break;

        case 'delta':
          if (!agentMsg) {
            agentMsg = addMessage('', 'agent');
          }
          agentText += event.content;
          agentMsg.textContent = agentText;
          scrollBottom();
          setStatus('生成中...');
          break;

        case 'done':
          setStatus(`conversation #${event.conversation_id}`);
          break;

        case 'error':
          addMessage(`Error: ${event.message}`, 'error');
          setStatus('');
          break;
      }
    }
  }
}

function parseSSE(raw) {
  const lines = raw.split('\n');
  let eventType = 'message';
  let data = '';
  for (const line of lines) {
    if (line.startsWith('event: ')) {
      eventType = line.slice(7).trim();
    } else if (line.startsWith('data: ')) {
      data = line.slice(6);
    }
  }
  if (!data) return null;
  try {
    const obj = JSON.parse(data);
    obj.type = eventType;
    return obj;
  } catch {
    return { type: eventType, content: data };
  }
}

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  document.getElementById('messages').appendChild(div);
  scrollBottom();
  return div;
}

function addToolCard(name, round, args) {
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.dataset.toolName = name;
  card.dataset.round = round;

  const header = document.createElement('div');
  header.className = 'tool-header';
  header.innerHTML = `<span class="spinner"></span><span class="icon">🔧</span> ${name} (轮次 ${round})`;
  card.appendChild(header);

  if (args && Object.keys(args).length > 0) {
    const argStr = document.createElement('div');
    argStr.style.cssText = 'color: #888; font-size: 12px; margin-top: 2px;';
    argStr.textContent = '参数: ' + JSON.stringify(args).slice(0, 200);
    card.appendChild(argStr);
  }

  document.getElementById('messages').appendChild(card);
  scrollBottom();
  return card;
}

function updateToolCard(name, round, success, content) {
  const cards = document.querySelectorAll('.tool-card');
  // 找最后一个匹配的卡片
  let target = null;
  for (const c of cards) {
    if (c.dataset.toolName === name && c.dataset.round == round) {
      target = c;
    }
  }
  if (!target) return;

  // 移除 spinner
  const spinner = target.querySelector('.spinner');
  if (spinner) spinner.remove();

  // 更新 header 图标
  const icon = target.querySelector('.tool-header .icon');
  if (icon) {
    icon.textContent = success ? '✅' : '❌';
  }

  // 添加结果
  const result = document.createElement('div');
  result.className = 'tool-result' + (success ? '' : ' error');
  result.textContent = content || '(无输出)';
  target.appendChild(result);
  scrollBottom();
}

function scrollBottom() {
  const el = document.getElementById('messages');
  el.scrollTop = el.scrollHeight;
}

function setStatus(text) {
  document.getElementById('status').textContent = text;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

// 启动时聚焦输入框
document.getElementById('input').focus();
</script>
</body>
</html>
