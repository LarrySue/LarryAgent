<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LarryAgent Logo 调试台</title>
<style>
  :root {
    --bg: #0F1117;
    --surface: #1A1D24;
    --elevated: #242830;
    --border: rgba(255,255,255,0.08);
    --text: #E4E4E7;
    --text-muted: #71717A;
    --accent: #378ADD;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, "Microsoft YaHei", system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    flex-wrap: wrap;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header .tip { color: var(--text-muted); font-size: 12px; }
  .controls { display: flex; align-items: center; gap: 10px; margin-left: auto; flex-wrap: wrap; }
  .controls label { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 6px; }
  select, button {
    background: var(--elevated);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  select:hover, button:hover { border-color: rgba(255,255,255,0.2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .colorbar {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 8px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    flex-wrap: wrap;
  }
  .colorbar .cb-label { font-size: 12px; color: var(--text-muted); }
  .color-picker { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .color-picker input[type="color"] {
    width: 26px; height: 26px; padding: 0; border: 1px solid var(--border);
    border-radius: 6px; background: none; cursor: pointer;
  }
  .color-picker input[type="text"] {
    width: 72px; background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 3px 6px; font-family: Consolas, monospace; font-size: 12px;
  }
  .palette { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .swatch {
    width: 20px; height: 20px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.15);
    cursor: pointer; transition: transform .1s;
  }
  .swatch:hover { transform: scale(1.2); }
  /* 文字（逐字母调色） */
  .wordbar { display: flex; align-items: center; gap: 12px; padding: 8px 16px; flex-wrap: wrap; border-bottom: 1px solid var(--border); background: var(--bg); }
  .wordbar input[type="text"].word {
    width: 160px; background: var(--surface); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 4px 8px; font-size: 14px; font-family: var(--font-sans), sans-serif;
  }
  .wordbar .wb-label { font-size: 12px; color: var(--text-muted); }
  #letter-pickers { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .letter-picker { display: flex; align-items: center; gap: 3px; }
  .letter-char {
    font-size: 13px; font-weight: 600; min-width: 14px; text-align: center; color: var(--text);
  }
  .letter-picker input[type="color"] {
    width: 24px; height: 24px; padding: 0; border: 1px solid var(--border);
    border-radius: 6px; background: none; cursor: pointer;
  }
  .letter-picker input[type="color"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  main { flex: 1; display: flex; min-height: 0; }
  .editor, .viewer { width: 50%; height: 100%; display: flex; flex-direction: column; }
  .editor { border-right: 1px solid var(--border); }
  .editor .panel-title, .viewer .panel-title {
    padding: 8px 12px; font-size: 12px; color: var(--text-muted);
    border-bottom: 1px solid var(--border); background: var(--surface);
  }
  textarea {
    flex: 1; width: 100%; background: var(--bg); color: var(--text);
    border: none; outline: none; resize: none; padding: 12px;
    font-family: Consolas, "Courier New", monospace; font-size: 13px;
    line-height: 1.5; tab-size: 2;
  }
  textarea:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .viewer-body {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px; overflow: auto;
    background-image:
      linear-gradient(45deg, rgba(255,255,255,0.05) 25%, transparent 25%),
      linear-gradient(-45deg, rgba(255,255,255,0.05) 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, rgba(255,255,255,0.05) 75%),
      linear-gradient(-45deg, transparent 75%, rgba(255,255,255,0.05) 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0;
    background-color: var(--bg);
    transition: background-color 0.2s;
  }
  .viewer-body[data-bg="surface"] { background-color: #1A1D24; }
  .viewer-body[data-bg="sidebar"] { background-color: #13141C; }
  .viewer-body[data-bg="light"] { background-color: #F4F4F5; }
  #preview svg { display: block; }
  #status {
    padding: 6px 12px; border-top: 1px solid var(--border);
    font-size: 12px; color: var(--text-muted); background: var(--surface); min-height: 28px;
  }
  #status.error { color: #EF4444; }
</style>
</head>
<body>
  <header>
    <h1>LarryAgent Logo 调试台</h1>
    <span class="tip">改源码 / 取色器调色 / 逐字母文字色，实时预览；满意后「复制源码」发我同步</span>
    <div class="controls">
      <label>预览尺寸
        <select id="size">
          <option value="24">24px（侧栏）</option>
          <option value="48">48px</option>
          <option value="96">96px</option>
          <option value="160">160px</option>
          <option value="256">256px</option>
          <option value="384" selected>384px</option>
        </select>
      </label>
      <label>背景
        <select id="bg">
          <option value="dark" selected>暗色（棋盘透明）</option>
          <option value="surface">容器 #1A1D24</option>
          <option value="sidebar">侧栏 #13141C</option>
          <option value="light">浅色 #F4F4F5</option>
        </select>
      </label>
      <button id="reload" title="从 /src/assets/logo.svg 重新载入当前源码">从 logo.svg 载入</button>
      <button id="copy" class="primary">复制源码</button>
      <button id="download">下载 .svg</button>
    </div>
  </header>

  <div class="colorbar">
    <span class="cb-label">图形调色（作用于对应元素）：</span>
    <span class="color-picker">圆环 <input type="color" id="c-ring"><input type="text" id="t-ring" spellcheck="false"></span>
    <span class="color-picker">笔触 <input type="color" id="c-brush"><input type="text" id="t-brush" spellcheck="false"></span>
    <span class="color-picker">红点 <input type="color" id="c-red"><input type="text" id="t-red" spellcheck="false"></span>
    <span class="color-picker">白点 <input type="color" id="c-white"><input type="text" id="t-white" spellcheck="false"></span>
    <span class="palette" id="palette" title="项目色板，点击应用到最近使用的取色器"></span>
  </div>

  <div class="wordbar">
    <span class="wb-label">文字（逐字母调色）：</span>
    <input type="text" class="word" id="word" value="LarryAgent" spellcheck="false" title="编辑文字内容（字母数可变）">
    <span id="letter-pickers"></span>
    <span class="palette" id="palette2" title="项目色板，点击应用到最近聚焦的字母"></span>
  </div>

  <main>
    <div class="editor">
      <div class="panel-title">SVG 源码（直接编辑，实时预览；文字块为 data-role="wordmark"）</div>
      <textarea id="src" spellcheck="false"></textarea>
    </div>
    <div class="viewer">
      <div class="panel-title">预览</div>
      <div class="viewer-body" id="viewerBody">
        <div id="preview"></div>
      </div>
      <div id="status"></div>
    </div>
  </main>

<script>
  const DEFAULT_SRC = `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="48" height="60" viewBox="0 0 48 60">
  <circle cx="24" cy="24" r="20" fill="none" stroke="#6596c8" stroke-width="2.5"
          stroke-dasharray="100 16" stroke-dashoffset="66.1" stroke-linecap="round" />
  <path d="M17 24 Q 15 32 28 27 Q 41 22 14 40" fill="none" stroke="#707070"
        stroke-width="3" stroke-linecap="round" />
  <circle cx="26" cy="15.5" r="2.3" fill="#c83c3c" />
  <circle cx="20" cy="16" r="2" fill="#bfbfbf" />
  <text x="24" y="52" text-anchor="middle" font-family="sans-serif" font-size="8" font-weight="600" data-role="wordmark"><tspan fill="#E4E4E7">LarryAgent</tspan></text>
</svg>`;

  // 元素角色 → (标签名, 第几个, 属性)
  const ROLES = {
    ring:   { tag: 'circle', nth: 0, attr: 'stroke' },
    brush:  { tag: 'path',   nth: 0, attr: 'stroke' },
    red:    { tag: 'circle', nth: 1, attr: 'fill'   },
    white:  { tag: 'circle', nth: 2, attr: 'fill'   },
  };
  const PICKERS = {};
  for (const [role, cfg] of Object.entries(ROLES)) {
    PICKERS[role] = {
      color: document.getElementById('c-' + role),
      text:  document.getElementById('t-' + role),
    };
  }

  const srcEl = document.getElementById('src');
  const previewEl = document.getElementById('preview');
  const statusEl = document.getElementById('status');
  const viewerBody = document.getElementById('viewerBody');
  const sizeEl = document.getElementById('size');
  const bgEl = document.getElementById('bg');
  const wordEl = document.getElementById('word');
  const letterBox = document.getElementById('letter-pickers');

  // === 文字模型：每字母 {char, color} ===
  let wordLetters = [];
  let activeLetter = -1; // 色板应用到哪个字母

  function escapeXml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // 从源码的 data-role="wordmark" 文字块解析字母
  function syncWordFromSource() {
    let doc;
    try {
      doc = new DOMParser().parseFromString(srcEl.value, 'image/svg+xml');
      if (doc.querySelector('parsererror')) return;
    } catch { return; }
    const textEl = doc.querySelector('text[data-role="wordmark"]');
    if (!textEl) {
      // 源码尚无文字块：按输入框当前词生成字母（改动时才插入 SVG）
      const seed = wordEl.value || 'LarryAgent';
      wordLetters = seed.split('').map(ch => ({ char: ch, color: '#E4E4E7' }));
      renderLetterPickers();
      return;
    }
    const spans = textEl.querySelectorAll('tspan');
    if (spans.length === 0) {
      const raw = textEl.textContent || '';
      wordLetters = raw.split('').map(ch => ({ char: ch, color: '#E4E4E7' }));
    } else {
      wordLetters = Array.from(spans).map(t => ({
        char: t.textContent || '',
        color: t.getAttribute('fill') || '#E4E4E7',
      }));
    }
    renderLetterPickers();
  }

  // 重建字母取色器 UI
  function renderLetterPickers() {
    wordEl.value = wordLetters.map(l => l.char).join('');
    letterBox.innerHTML = '';
    wordLetters.forEach((l, i) => {
      const wrap = document.createElement('span');
      wrap.className = 'letter-picker';
      const ch = document.createElement('span');
      ch.className = 'letter-char';
      ch.textContent = l.char || '?';
      const inp = document.createElement('input');
      inp.type = 'color';
      inp.value = l.color;
      inp.dataset.i = i;
      inp.title = '第 ' + (i + 1) + ' 个字母 ' + (l.char || '');
      inp.addEventListener('focus', () => { activeLetter = i; });
      inp.addEventListener('input', () => {
        wordLetters[i].color = inp.value;
        updateWordInSource();
        render();
        applySize();
      });
      wrap.appendChild(ch);
      wrap.appendChild(inp);
      letterBox.appendChild(wrap);
    });
  }

  // 把 wordLetters 写回源码（保留 text 开标签属性，只重建内部 tspan；没有则插入）
  function updateWordInSource() {
    if (wordLetters.length === 0) return;
    const tspans = wordLetters
      .map(l => `<tspan fill="${l.color}">${escapeXml(l.char)}</tspan>`)
      .join('');
    const re = /(<text\b[^>]*?data-role="wordmark"[^>]*>)([\s\S]*?)(<\/text>)/;
    if (re.test(srcEl.value)) {
      srcEl.value = srcEl.value.replace(re, `$1${tspans}$3`);
    } else {
      // 首次插入文字块：画布从 48x48 拉高到 48x60，文字放在圆环下方
      srcEl.value = srcEl.value.replace(/viewBox="0 0 48 48"/, 'viewBox="0 0 48 60"');
      const block =
        `<text x="24" y="52" text-anchor="middle" font-family="sans-serif" ` +
        `font-size="8" font-weight="600" data-role="wordmark">${tspans}</text>`;
      srcEl.value = srcEl.value.replace(/<\/svg>/, `  ${block}\n</svg>`);
    }
  }

  wordEl.addEventListener('change', () => {
    const newWord = wordEl.value || 'LarryAgent';
    const colors = wordLetters.map(l => l.color);
    wordLetters = newWord.split('').map((ch, i) => ({
      char: ch,
      color: colors[i] || '#E4E4E7',
    }));
    updateWordInSource();
    render();
    applySize();
    renderLetterPickers();
  });

  function render() {
    const svg = srcEl.value.trim();
    previewEl.innerHTML = '';
    if (!svg) { statusEl.textContent = '（空）'; return; }
    try {
      const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
      if (doc.querySelector('parsererror')) throw new Error('SVG 语法错误，检查尖括号/引号');
      previewEl.appendChild(doc.documentElement.cloneNode(true));
      statusEl.textContent = 'OK · 改满意后点「复制源码」';
      statusEl.classList.remove('error');
    } catch (e) {
      statusEl.textContent = '✗ ' + e.message;
      statusEl.classList.add('error');
    }
  }

  function applySize() {
    const svg = previewEl.querySelector('svg');
    if (svg) { svg.setAttribute('width', sizeEl.value); svg.removeAttribute('height'); }
  }

  // 解析当前源码，把各角色颜色同步到取色器
  function syncPickers() {
    let doc;
    try {
      doc = new DOMParser().parseFromString(srcEl.value, 'image/svg+xml');
      if (doc.querySelector('parsererror')) return;
    } catch { return; }
    for (const [role, cfg] of Object.entries(ROLES)) {
      const els = doc.querySelectorAll(cfg.tag);
      const el = els[cfg.nth];
      if (el && el.hasAttribute(cfg.attr)) {
        const v = el.getAttribute(cfg.attr);
        if (/^#[0-9a-fA-F]{3,8}$/.test(v)) {
          PICKERS[role].color.value = v;
          PICKERS[role].text.value = v;
        }
      }
    }
    syncWordFromSource();
  }

  // 在源码中，把「第 nth 个 <tag> 标签内第一个 attr="..."」替换为新值
  function setAttrInSource(tag, nth, attr, value) {
    const re = new RegExp(`(<${tag}\\b[^>]*?)${attr}="[^"]*"`, 'g');
    let count = 0;
    srcEl.value = srcEl.value.replace(re, (m, prefix) => {
      if (count++ === nth) return `${prefix}${attr}="${value}"`;
      return m;
    });
  }

  // 图形取色器
  for (const [role, cfg] of Object.entries(ROLES)) {
    const apply = (val) => {
      const v = /^#[0-9a-fA-F]{3,8}$/.test(val) ? val : '#' + val.replace(/[^0-9a-fA-F]/g, '').slice(0, 6);
      if (!/^#[0-9a-fA-F]{3,8}$/.test(v)) return;
      setAttrInSource(cfg.tag, cfg.nth, cfg.attr, v);
      render();
      applySize();
      syncPickers();
    };
    PICKERS[role].color.addEventListener('input', () => apply(PICKERS[role].color.value));
    PICKERS[role].text.addEventListener('change', () => apply(PICKERS[role].text.value));
    PICKERS[role].color.addEventListener('focus', () => activeRole = role);
    PICKERS[role].text.addEventListener('focus', () => activeRole = role);
  }

  let activeRole = 'ring';

  // 项目色板（两个色板共用同一逻辑）
  const PALETTE = ['#378ADD', '#5BA4ED', '#E4E4E7', '#A1A1AA', '#71717A',
                   '#EF4444', '#10B981', '#F59E0B', '#9CA3AF', '#34D399', '#FBBF24', '#0F1117'];
  function applyPalette(hex) {
    if (activeRole === 'letter' || activeLetter >= 0) {
      const i = activeLetter;
      if (i >= 0 && i < wordLetters.length) {
        wordLetters[i].color = hex;
        updateWordInSource();
        render();
        applySize();
        renderLetterPickers();
        return;
      }
    }
    if (PICKERS[activeRole]) {
      PICKERS[activeRole].color.value = hex;
      PICKERS[activeRole].text.value = hex;
      const cfg = ROLES[activeRole];
      setAttrInSource(cfg.tag, cfg.nth, cfg.attr, hex);
      render();
      applySize();
      syncPickers();
    }
  }
  function buildPalette(containerId) {
    const box = document.getElementById(containerId);
    PALETTE.forEach(hex => {
      const s = document.createElement('span');
      s.className = 'swatch';
      s.style.background = hex;
      s.title = hex;
      s.addEventListener('click', () => applyPalette(hex));
      box.appendChild(s);
    });
  }
  buildPalette('palette');
  buildPalette('palette2');

  srcEl.addEventListener('input', () => { render(); applySize(); syncPickers(); });
  sizeEl.addEventListener('change', applySize);
  bgEl.addEventListener('change', () => { viewerBody.dataset.bg = bgEl.value; });

  document.getElementById('reload').addEventListener('click', async () => {
    statusEl.textContent = '载入中…';
    try {
      const res = await fetch('/src/assets/logo.svg');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      srcEl.value = await res.text();
      render(); applySize(); syncPickers();
    } catch (e) {
      statusEl.textContent = '✗ 载入失败：' + e.message;
      statusEl.classList.add('error');
    }
  });

  document.getElementById('copy').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(srcEl.value.trim());
      statusEl.textContent = '✓ 已复制到剪贴板';
      statusEl.classList.remove('error');
    } catch {
      srcEl.select();
      statusEl.textContent = '✗ 无法自动复制，请手动 Ctrl+C（已全选）';
      statusEl.classList.add('error');
    }
  });

  document.getElementById('download').addEventListener('click', () => {
    const blob = new Blob([srcEl.value.trim()], { type: 'image/svg+xml' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'logo.svg'; a.click();
    URL.revokeObjectURL(url);
    statusEl.textContent = '✓ 已下载 logo.svg';
    statusEl.classList.remove('error');
  });

  // 初始化
  (async () => {
    try {
      const res = await fetch('/src/assets/logo.svg');
      if (res.ok) {
        srcEl.value = await res.text();
        statusEl.textContent = '已从当前 logo.svg 载入';
      } else {
        srcEl.value = DEFAULT_SRC;
        statusEl.textContent = '未能载入 logo.svg（HTTP ' + res.status + '），已用默认源码';
      }
    } catch {
      srcEl.value = DEFAULT_SRC;
      statusEl.textContent = 'dev server 未运行，已用默认源码';
    }
    render(); applySize(); syncPickers();
  })();
</script>
</body>
</html>
