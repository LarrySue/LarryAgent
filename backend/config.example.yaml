# ============================================================
# LarryAgent 配置文件
# 所有配置项均从此文件读取，启动时由 config.py 加载
# ============================================================

# 当前机器的硬编码标识，用于区分不同设备
# 单人使用场景下，你可以为每台设备设定唯一 ID
machine_id: "desktop-01"

# ============================================================
# 模型配置
# 支持同时配置多个模型提供商，运行时按请求指定切换
# ============================================================
models:
  deepseek:
    api_key: ""
    base_url: "https://api.deepseek.com"
    # 可用模型列表由 API 返回，此处仅配置连接信息

  qwen:
    api_key: ""
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

  gpt:
    api_key: ""
    base_url: "https://api.openai.com/v1"

  # 可继续添加其他兼容 OpenAI 接口的模型
  # custom_model:
  #   api_key: ""
  #   base_url: ""

# ============================================================
# 服务配置
# ============================================================
server:
  host: "127.0.0.1"  # 监听地址，仅限本机访问（P5 移动端需要局域网访问时再放开，届时须先加 API Key）
  port: 8000          # 监听端口
  api_key: ""         # P5 放开局域网访问前必须设置，否则等于无鉴权暴露 shell 工具

# ============================================================
# 数据库配置
# ============================================================
database:
  # SQLite 文件路径，相对于 backend/ 目录
  path: "data/larry.db"

# ============================================================
# 向量库配置（ChromaDB 本地持久化）
# ============================================================
vector_store:
  enabled: false        # P1.4 接通长期记忆时改为 true
  path: "data/chroma"   # ChromaDB 数据存储路径，相对于 backend/ 目录
  collection_name: "larry_memories"

# ============================================================
# 日志配置
# ============================================================
logging:
  level: "DEBUG"       # DEBUG / INFO / WARNING / ERROR

# ============================================================
# Embedding 配置
# ============================================================
embedding:
  # 提供商：local 使用本地模型，openai 使用云端 API
  provider: "local"
  model: "text-embedding-3-small"
  api_key: ""          # provider 为 openai 时填入
  base_url: ""         # provider 为 openai 时填入，留空则复用 deepseek 配置
  # 本地模型配置（provider 为 local 时生效）
  local_model_name: "BAAI/bge-small-zh-v1.5"
  hf_endpoint: "https://hf-mirror.com"  # 国内 HuggingFace 镜像，海外留空
  # local_model_path: "models/bge-small-zh"

# ============================================================
# 角色配置
# 每个角色可定义 system_prompt 和可用工具列表
# 未配置 tools 则该角色可使用所有已注册工具
# label（显示名，缺省回退 = key）/ color（hex，缺省回退 = #9CA3AF）
# 角色清单经 GET /api/roles 下发给前端，加新角色只需在此新增段 + 重启
# ============================================================
roles:
  default:
    label: "通用"
    color: "#9CA3AF"
    system_prompt: "你是 LarryAgent，一个个人 AI 助手。你可以调用工具来读写文件和执行命令。"
    # tools: ["file_ops", "shell"]  # 省略则允许所有工具

  code:
    label: "编程"
    color: "#60A5FA"
    system_prompt: "你是 Larry 的编程搭档，擅长代码编写、调试与架构设计。假设用户具备专业能力，直接讨论技术细节。"

  health:
    label: "健康"
    color: "#34D399"
    system_prompt: "你是 Larry 的健康管理顾问，关注饮食、运动、睡眠与体检数据，帮助建立和维持健康习惯。不提供医疗诊断，疑似病症建议就医。"

  finance:
    label: "金融"
    color: "#FBBF24"
    system_prompt: "你是 Larry 的金融助手，关注投资理财、财务规划等话题。"

# ============================================================
# 工具安全配置
# ============================================================
tools:
  # Shell 工具白名单：仅允许来自这些 IP 的请求执行 Shell 命令
  # 单人使用建议只保留 127.0.0.1
  shell_allowed_ips:
    - "127.0.0.1"
    - "::1"

  # Shell 命令执行超时（秒），超时后自动杀进程树
  shell_timeout: 30

  # FileOps 工具的工作目录（文件读写限制在此目录内）
  file_ops_workspace: "~/larry_workspace"

  # Function calling 最大轮次（防死循环）
  function_calling_max_iterations: 10

# ============================================================
# LLM 调用配置
# ============================================================
llm:
  # 失败重试次数（网络错误 / 429 / 5xx），4xx 不重试
  max_retries: 3

  # 重试指数退避基数（秒），实际等待 = base * 2^(attempt-1)
  retry_backoff_base: 1.0

  # 单次请求最大输入 token 数，超出截断旧消息
  max_input_tokens: 128000

  # 是否在日志中输出 raw 请求/响应正文（调试用，默认关闭）
  debug_log: false
