# ============================================================
# LarryAgent 配置文件
# 所有配置项均从此文件读取，启动时由 config.py 加载
# ============================================================

# 当前机器的硬编码标识，用于区分不同设备
# 单人使用场景下，你可以为每台设备设定唯一 ID
machine_id: "desktop-01"

# ============================================================
# 模型配置
# 支持同时配置多个模型提供商，运行时按请求指定切换
# ============================================================
models:
  deepseek:
    api_key: ""
    base_url: "https://api.deepseek.com"
    # 可用模型列表由 API 返回，此处仅配置连接信息

  qwen:
    api_key: ""
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"

  gpt:
    api_key: ""
    base_url: "https://api.openai.com/v1"

  # 可继续添加其他兼容 OpenAI 接口的模型
  # custom_model:
  #   api_key: ""
  #   base_url: ""

# ============================================================
# 服务配置
# ============================================================
server:
  host: "0.0.0.0"    # 监听地址，0.0.0.0 表示允许局域网访问
  port: 8000          # 监听端口

# ============================================================
# 数据库配置
# ============================================================
database:
  # SQLite 文件路径，相对于 backend/ 目录
  path: "data/larry.db"

# ============================================================
# Qdrant 向量库配置
# ============================================================
qdrant:
  enabled: false       # MVP 阶段可关闭，无需启动 Qdrant
  host: "localhost"
  port: 6333
  # 集合名称，用于存储长期记忆和文档向量
  collection_name: "larry_memories"

# ============================================================
# 日志配置
# ============================================================
logging:
  level: "DEBUG"       # DEBUG / INFO / WARNING / ERROR

# ============================================================
# Embedding 配置
# ============================================================
embedding:
  # 提供商：openai 使用云端 API，local 使用本地模型
  provider: "openai"
  model: "text-embedding-3-small"
  api_key: ""          # 如果 provider 为 openai，这里填 API Key
  # 本地模型配置（provider 为 local 时生效）
  # local_model_path: "models/bge-small-zh"

# ============================================================
# 工具安全配置
# ============================================================
tools:
  # Shell 工具白名单：仅允许来自这些 IP 的请求执行 Shell 命令
  # 单人使用建议只保留 127.0.0.1
  shell_allowed_ips:
    - "127.0.0.1"
    - "::1"
