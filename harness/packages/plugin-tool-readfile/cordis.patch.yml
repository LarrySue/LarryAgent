# plugin-tool-readfile 的 bundle 层：`dsh plugin --profile sdk add <本包目录>` 后由 dsh 加载。
# ⚠️ patch 是**整行覆盖**语义（后层按 id 覆盖前层，覆盖整行 config 而非深合并）。
# ⚠️ 本插件**零硬依赖**（`inject: []`）：`tools` 服务缺失时它仍会激活，只记 `degraded` 打点、不注册工具。
# `activateMarker` 缺省落在 `<DSH_HOME>/plugin-tool-readfile.activate.log`（S0 判据 ② 的 boot 期打点处）；
# 置 false 可关掉打点。
- insert:
    - id: plugin-tool-readfile
      name: '@larryagent/plugin-tool-readfile'
      config:
        maxBytes: 65536
