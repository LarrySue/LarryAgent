<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DSH 调试体验台 · 3.9.1</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --fg: #d8dde6; --dim: #8b93a1; --accent: #4ea1ff; --ok: #3ecf8e; --warn: #f5a623; --bad: #ef5350;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.5 "Cascadia Mono", Consolas, "Microsoft YaHei", monospace;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 8px 14px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex: 0 0 auto;
  }
  header .title { font-weight: 700; letter-spacing: .5px; }
  header .meta { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .grow { flex: 1; }
  .badge { padding: 1px 8px; border-radius: 10px; font-size: 12px; border: 1px solid var(--line); }
  .badge.ok { color: var(--ok); border-color: #23503d; }
  .badge.bad { color: var(--bad); border-color: #5a2a2a; }
  button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font: inherit;
  }
  button:hover { border-color: var(--accent); }
  button.primary { border-color: #2d5f8f; color: #cfe6ff; }
  button.danger { border-color: #6a3333; color: #ffc9c9; }
  main { flex: 1; display: flex; min-height: 0; }
  #chatPane { flex: 1 1 58%; display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  #eventsPane { flex: 1 1 42%; display: flex; flex-direction: column; min-width: 0; background: #12151b; }
  .paneHead {
    display: flex; align-items: center; gap: 8px; padding: 6px 12px; color: var(--dim);
    border-bottom: 1px solid var(--line); font-size: 12px; flex: 0 0 auto;
  }
  .paneHead .grow { flex: 1; }
  #messages { flex: 1; overflow-y: auto; padding: 12px; }
  .msg { margin: 0 0 10px; display: flex; flex-direction: column; }
  .msg .who { font-size: 11px; color: var(--dim); margin-bottom: 2px; }
  .msg .body {
    white-space: pre-wrap; word-break: break-word; padding: 7px 10px; border-radius: 8px;
    background: var(--panel2); border: 1px solid var(--line); max-width: 96%;
  }
  .msg.user { align-items: flex-end; }
  .msg.user .body { background: #17324a; border-color: #23486b; }
  .msg.assistant .body { background: #1b1f27; }
  .msg.system .body { background: #1a1c18; border-color: #3a3a2a; color: #c9c7a8; }
  .msg .note { font-size: 11px; color: var(--dim); margin-top: 3px; }
  #composer { flex: 0 0 auto; display: flex; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
  #composer textarea {
    flex: 1; resize: none; height: 62px; background: var(--panel2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: inherit;
  }
  #events { flex: 1; overflow-y: auto; padding: 8px 0; }
  .ev { border-bottom: 1px solid #1d2129; padding: 3px 12px; cursor: pointer; }
  .ev:hover { background: #191d25; }
  .ev .row { display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
  .ev .seq { color: var(--accent); width: 44px; text-align: right; flex: 0 0 auto; }
  .ev .type { color: var(--fg); flex: 0 0 auto; }
  .ev .snippet { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
  .ev .time { margin-left: auto; color: #575e6b; font-size: 11px; flex: 0 0 auto; }
  .ev pre {
    display: none; margin: 6px 0 8px 52px; padding: 8px; background: #0b0d11;
    border: 1px solid var(--line); border-radius: 6px; white-space: pre-wrap; word-break: break-word;
    color: #b9c2d0; max-height: 340px; overflow: auto;
  }
  .ev.open pre { display: block; }
  .ev.synthetic .type { color: var(--warn); }
  .ev.approval { background: #241a12; }
  .ev.approval .type { color: var(--warn); }
  .empty { color: var(--dim); padding: 16px; }
  #modalWrap {
    position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none;
    align-items: center; justify-content: center; z-index: 20;
  }
  #modalWrap.show { display: flex; }
  #modal {
    width: min(640px, 92vw); background: var(--panel); border: 1px solid #5b4526;
    border-radius: 10px; padding: 18px; box-shadow: 0 18px 60px rgba(0,0,0,.5);
  }
  #modal h2 { margin: 0 0 10px; font-size: 15px; color: var(--warn); }
  #modal .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 10px; margin: 10px 0 16px; }
  #modal .kv .k { color: var(--dim); }
  #modal .actions { display: flex; gap: 10px; justify-content: flex-end; }
  #toast {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
    background: #22262f; border: 1px solid var(--line); color: var(--fg);
    padding: 7px 14px; border-radius: 8px; display: none; z-index: 30;
  }
</style>
</head>
<body>
<header>
  <span class="title">DSH 调试体验台</span>
  <span class="badge" id="connBadge">连接中…</span>
  <span class="meta" id="sessionMeta"></span>
  <span class="meta" id="usageTotal" title="输入(未命中) | 缓存命中 | 输出"></span>
  <span class="grow"></span>
  <button id="stopBtn" class="danger" title="发协议 shutdown，等 dsh 自退并关闭本台">停止 bridge</button>
</header>
<main>
  <section id="chatPane">
    <div class="paneHead">
      <span>对话</span><span class="grow"></span><span id="roundInfo"></span>
    </div>
    <div id="messages"><div class="empty">发一句话开始。同一 session 会被连续询问（多轮上下文保持）。</div></div>
    <div id="composer">
      <textarea id="input" placeholder="输入消息…（Enter 发送 / Shift+Enter 换行）"></textarea>
      <button id="sendBtn" class="primary">发送</button>
    </div>
  </section>
  <section id="eventsPane">
    <div class="paneHead">
      <span>事件流（session.event）</span><span class="grow"></span>
      <span id="evCount">0</span>
      <button id="clearBtn" title="仅清空显示，不删证据文件">清屏</button>
    </div>
    <div id="events"></div>
  </section>
</main>

<div id="modalWrap">
  <div id="modal">
    <h2>⚠ 审批请求</h2>
    <div class="kv" id="modalKv"></div>
    <div class="actions">
      <button class="danger" id="rejectBtn">拒绝（rejected）</button>
      <button class="primary" id="approveBtn">批准（allowed-once）</button>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id)
  const messages = $('messages')
  const events = $('events')
  const connBadge = $('connBadge')
  const sessionMeta = $('sessionMeta')
  const evCount = $('evCount')
  const input = $('input')
  const toastEl = $('toast')

  let ws = null
  let sessionId = ''
  let count = 0
  let rounds = 0
  let stopped = false
  const usageAgg = { input: 0, cache: 0, output: 0 }
  const renderUsageTotal = () => {
    $('usageTotal').textContent = `tok in ${usageAgg.input} | cache ${usageAgg.cache} | out ${usageAgg.output}`
  }
  const approvalQueue = []

  const now = () => new Date().toTimeString().slice(0, 8)
  const el = (tag, cls, text) => {
    const n = document.createElement(tag)
    if (cls) n.className = cls
    if (text !== undefined) n.textContent = text
    return n
  }
  const toast = (text) => {
    toastEl.textContent = text
    toastEl.style.display = 'block'
    clearTimeout(toast._t)
    toast._t = setTimeout(() => { toastEl.style.display = 'none' }, 2200)
  }

  /** 事件里的正文块（兼容 data.message.content 与 data.content 两种形状）。 */
  function blocksOf(ev) {
    const d = ev?.data ?? {}
    const arr = d.message?.content ?? d.content ?? []
    if (!Array.isArray(arr)) return []
    return arr.map((b) => (b && b.type === 'text' && typeof b.text === 'string') ? b.text : '').filter(Boolean)
  }
  function textOf(ev) { return blocksOf(ev).join('\n') }

  function addMessage(kind, text, note) {
    const empty = messages.querySelector('.empty')
    if (empty) empty.remove()
    const wrap = el('div', 'msg ' + kind)
    wrap.appendChild(el('div', 'who', kind === 'user' ? '你' : kind === 'assistant' ? 'dsh' : 'system'))
    wrap.appendChild(el('div', 'body', text))
    if (note) wrap.appendChild(el('div', 'note', note))
    messages.appendChild(wrap)
    messages.scrollTop = messages.scrollHeight
  }

  function addEvent(ev, extraClass) {
    count += 1
    evCount.textContent = String(count)
    const type = String(ev?.type ?? '(no type)')
    const seq = Number.isFinite(ev?.seq) ? ev.seq : (ev?.seq ?? '')
    const text = textOf(ev).replace(/\s+/g, ' ').slice(0, 160)
    const row = el('div', 'ev' + (extraClass ? ' ' + extraClass : ''))
    const line = el('div', 'row')
    line.appendChild(el('span', 'seq', '#' + seq))
    line.appendChild(el('span', 'type', type))
    line.appendChild(el('span', 'snippet', text))
    line.appendChild(el('span', 'time', now()))
    row.appendChild(line)
    const pre = el('pre', '', JSON.stringify(ev, null, 2))
    row.appendChild(pre)
    row.addEventListener('click', () => row.classList.toggle('open'))
    events.appendChild(row)
    events.scrollTop = events.scrollHeight
  }

  function showNextApproval() {
    if ($('modalWrap').classList.contains('show')) return
    const a = approvalQueue.shift()
    if (!a) return
    const kv = $('modalKv')
    kv.textContent = ''
    const rows = [
      ['工具', a.toolName ?? '(未提供)'],
      ['原因', a.reason ?? '(未提供)'],
      ['requestId', a.requestId ?? '(未提供)'],
      ['frameId', a.frameId ?? '(未取到 ⇒ 无法应答)'],
      ['callId', a.callId ?? '—'],
      ['agentId', a.agentId ?? '—'],
    ]
    for (const [k, v] of rows) {
      kv.appendChild(el('div', 'k', k))
      kv.appendChild(el('div', 'v', String(v)))
    }
    $('modalWrap').classList.add('show')
    $('modalWrap').dataset.frameId = a.frameId ?? ''
    $('modalWrap').dataset.index = String(a.index)
  }

  function answer(result) {
    const wrap = $('modalWrap')
    const raw = wrap.dataset.frameId
    const frameId = raw === '' ? null : (Number.isNaN(Number(raw)) ? raw : Number(raw))
    wrap.classList.remove('show')
    send({ type: 'approval-answer', frameId, result })
    addMessage('system', `已提交审批决定：${result}（frameId=${String(frameId)}）`)
    setTimeout(showNextApproval, 120)
  }

  function send(obj) {
    if (!ws || ws.readyState !== WebSocket.OPEN) { toast('未连接'); return }
    ws.send(JSON.stringify(obj))
  }

  function sendPrompt() {
    const text = input.value.trim()
    if (!text) return
    addMessage('user', text)
    send({ type: 'prompt', text })
    input.value = ''
    rounds += 1
    $('roundInfo').textContent = `已发送 ${rounds} 轮`
  }

  $('sendBtn').addEventListener('click', sendPrompt)
  $('approveBtn').addEventListener('click', () => answer('allowed-once'))
  $('rejectBtn').addEventListener('click', () => answer('rejected'))
  $('clearBtn').addEventListener('click', () => { events.textContent = ''; count = 0; evCount.textContent = '0' })
  $('stopBtn').addEventListener('click', () => {
    if (!confirm('停止 bridge：会发协议 shutdown 并等 dsh 自退，然后关闭页面服务。继续？')) return
    stopped = true
    send({ type: 'stop' })
    toast('已请求停止，等待 dsh 退出…')
  })
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendPrompt() }
  })

  function connect() {
    const proto = location.protocol === 'https:' ? 'wss' : 'ws'
    ws = new WebSocket(`${proto}://${location.host}`)
    ws.onopen = () => {
      connBadge.textContent = '已连接'
      connBadge.className = 'badge ok'
    }
    ws.onclose = () => {
      connBadge.textContent = stopped ? '已停止' : '连接断开'
      connBadge.className = 'badge bad'
    }
    ws.onerror = () => {
      connBadge.textContent = '连接错误'
      connBadge.className = 'badge bad'
    }
    ws.onmessage = (e) => {
      let msg
      try { msg = JSON.parse(e.data) } catch { return }
      if (msg.type === 'hello') {
        sessionId = msg.sessionId
        sessionMeta.textContent = `session=${sessionId}  child=${msg.childPid}  cwd=${msg.cwd}`
        return
      }
      if (msg.type === 'event') {
        const ev = msg.event
        addEvent(ev, ev?.data?.source?.kind === 'plugin' ? 'synthetic' : '')
        const type = ev?.type
        if (type === 'user/message' && ev?.data?.source?.kind !== 'plugin') {
          // 页面已乐观渲染用户消息；这里不重复
        } else if (type === 'user/message' && ev?.data?.source?.kind === 'plugin') {
          // 召回注入走 context 面（synthetic user/message）；左侧显示便于肉眼验证
          const t = textOf(ev)
          if (t && /##\s*LarryAgent 记忆召回/.test(t)) {
            addMessage('system', t, `召回注入（context 面 user/message #${ev.seq}）`)
          }
        } else if (type === 'system/message') {
          const t = textOf(ev)
          if (t && /##\s*LarryAgent 记忆召回/.test(t)) {
            addMessage('system', t, `召回注入（system/message #${ev.seq}）`)
          }
        } else if (type === 'assistant/message') {
          const t = textOf(ev)
          const u = ev?.data?.usage
          if (u) {
            usageAgg.input += Number(u.inputTokens ?? 0)
            usageAgg.cache += Number(u.cacheReadTokens ?? 0)
            usageAgg.output += Number(u.outputTokens ?? 0)
            renderUsageTotal()
          }
          if (t) {
            const note = u
              ? `assistant/message #${ev.seq} · in ${u.inputTokens}（未命中）/ cache ${u.cacheReadTokens ?? 0}（命中）/ out ${u.outputTokens}`
              : `assistant/message #${ev.seq}`
            addMessage('assistant', t, note)
          }
        } else if (type === 'turn/end') {
          const kind = ev?.data?.reason?.kind ?? '(unknown)'
          addMessage('system', `回合结束：${kind}`, `turn/end #${ev.seq}`)
        }
        return
      }
      if (msg.type === 'notification' && msg.method === 'session.status') {
        addEvent({ type: `session.status(${msg.params?.status ?? '?'})`, seq: '', data: msg.params }, '')
        return
      }
      if (msg.type === 'approval') {
        const a = msg.approval ?? {}
        a.index = count
        addEvent({ type: 'approval/request', seq: '', data: a }, 'approval')
        approvalQueue.push(a)
        showNextApproval()
        return
      }
      if (msg.type === 'approval-result') {
        addEvent({ type: 'approval/result', seq: '', data: msg }, 'approval')
        toast(`审批回传：${msg.result}（accepted=${msg.accepted}）`)
        return
      }
      if (msg.type === 'prompt-accepted') {
        return
      }
      if (msg.type === 'error') {
        addMessage('system', msg.message)
        toast(msg.message)
        return
      }
      if (msg.type === 'stopping') {
        stopped = true
        addMessage('system', `bridge 正在停止：${msg.reason}`)
        return
      }
      addEvent({ type: msg.type ?? '(unknown)', seq: '', data: msg }, '')
    }
  }

  connect()
})()
</script>
</body>
</html>
